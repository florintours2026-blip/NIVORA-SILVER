<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AUREVIA | الفخامة المطلقة</title>
    <link rel="stylesheet" href="style.css">
    <!-- إضافة خطوط جوجل للفخامة -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
</head>
<body>

    <!-- 1. شاشة البداية (Splash Screen) -->
    <div id="splash-screen" class="splash-screen">
        <div class="logo-container">
            <h1 class="logo-text">AUREVIA</h1>
            <p class="tagline">حيث تلتقي الفخامة بالأناقة</p>
        </div>
    </div>

    <!-- 2. شاشة تسجيل الدخول -->
    <div id="login-screen" class="login-screen hidden">
        <div class="login-box">
            <h2>تسجيل الدخول</h2>
            <p class="subtitle">انضم إلى عالمنا الحصري</p>
            
            <form id="login-form">
                <input type="text" placeholder="البريد الإلكتروني أو رقم الهاتف" required>
                <input type="password" placeholder="كلمة المرور" required>
                <button type="submit" class="btn-primary">دخول</button>
            </form>
            
            <div class="social-login">
                <p>أو الدخول عبر</p>
                <div class="social-icons">
                    <button class="social-btn fb">فيسبوك</button>
                    <button class="social-btn icloud">آيكلاود</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 3. واجهة المتجر (Main Store) -->
    <div id="main-store" class="main-store hidden">
        <header>
            <div class="header-content">
                <h1 class="logo-small">AUREVIA</h1>
                <nav>
                    <a href="#">الرئيسية</a>
                    <a href="#">المجموعة</a>
                    <a href="#">اكتشف</a>
                    <a href="#">تواصل معنا</a>
                    <a href="admin.html" class="admin-link">لوحة الإدارة</a>
                </nav>
            </div>
        </header>

        <section class="hero">
            <div class="hero-text">
                <h2>روائح خالدة. انطباع دائم.</h2>
                <p>نصنع أكثر من مجرد عطور — نصنع ذكريات تدوم.</p>
                <button class="btn-primary">اكتشف المجموعة</button>
            </div>
        </section>

        <section class="products-preview">
            <h3>أحدث المنتجات</h3>
            <div class="product-grid" id="product-grid">
                <!-- سيتم تعبئة المنتجات هنا بواسطة JavaScript -->
            </div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
