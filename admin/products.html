<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>المنتجات</title><link rel="stylesheet" href="../assets/css/main.css"></head><body class="admin-shell"><div class="admin-nav"><div class="container admin-nav-inner"><div class="cinzel">NIVORA SILVER ADMIN</div><a href="index.html">الرئيسية</a></div></div><main class="container"><div class="page-head"><h1>المنتجات</h1></div><div style="overflow:auto"><table class="admin-table"><thead><tr><th>ID</th><th>المنتج</th><th>الفئة</th><th>السعر</th><th>المخزون</th><th>Image URL</th></tr></thead><tbody id="rows"></tbody></table></div></main><script>fetch('../api/products').then(r=>r.json()).then(a=>rows.innerHTML=a.map(p=>`<tr><td>${p.id}</td><td>${p.name_ar}</td><td>${p.category}</td><td>${p.price} EGP</td><td>${p.stock?'متوفر':'غير متوفر'}</td><td style="max-width:300px;word-break:break-all">${p.images[0]}</td></tr>`).join(''))</script></body></html>
