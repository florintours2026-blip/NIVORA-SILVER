<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الطلبات</title><link rel="stylesheet" href="../assets/css/main.css"></head><body class="admin-shell"><div class="admin-nav"><div class="container admin-nav-inner"><div class="cinzel">NIVORA SILVER ADMIN</div><a href="index.html">الرئيسية</a></div></div><main class="container"><div class="page-head"><h1>الطلبات</h1></div><div style="overflow:auto"><table class="admin-table"><thead><tr><th>رقم</th><th>العميل</th><th>الهاتف</th><th>الإجمالي</th><th>الحالة</th><th>التاريخ</th></tr></thead><tbody id="rows"></tbody></table></div></main><script>fetch('../api/orders').then(r=>r.json()).then(a=>rows.innerHTML=a.length?a.map(o=>`<tr><td>${o.id}</td><td>${o.customer.name}</td><td>${o.customer.phone}</td><td>${o.totals.total||0} EGP</td><td>${o.status}</td><td>${new Date(o.createdAt).toLocaleString('ar-EG')}</td></tr>`).join(''):'<tr><td colspan="6">لا توجد طلبات بعد.</td></tr>')</script></body></html>
