<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<script src="config/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/nivora-core.js"></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سلة التسوق | NIVORA</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        .cart-layout { display: grid; grid-template-columns: 2fr 1fr; gap: 30px; padding: 40px 5%; }
        .cart-items { background: var(--bg-card); border: 1px solid #1a1a1a; border-radius: 8px; padding: 25px; }
        .cart-item { display: flex; gap: 20px; align-items: center; padding: 20px 0; border-bottom: 1px solid #1a1a1a; }
        .cart-item:last-child { border-bottom: none; }
        .cart-item img { width: 100px; height: 100px; object-fit: cover; border-radius: 5px; }
        .cart-item-info { flex: 1; }
        .cart-item-info h4 { margin-bottom: 5px; }
        .cart-item-info p { color: var(--gold); font-weight: bold; }
        .cart-item-actions { display: flex; align-items: center; gap: 15px; }
        .cart-qty { display: flex; align-items: center; gap: 10px; }
        .cart-qty button { width: 30px; height: 30px; background: var(--bg-surface); border: 1px solid #333; color: white; border-radius: 3px; cursor: pointer; }
        .cart-qty input { width: 40px; text-align: center; background: transparent; border: none; color: white; }
        .remove-item { color: var(--danger); cursor: pointer; font-size: 1.2rem; transition: var(--transition); }
        .remove-item:hover { color: #ff6b6b; }
        
        .cart-summary { background: var(--bg-card); border: 1px solid #1a1a1a; border-radius: 8px; padding: 25px; height: fit-content; position: sticky; top: 100px; }
        .cart-summary h3 { font-family: var(--font-heading); color: var(--gold); margin-bottom: 20px; }
        .summary-row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #1a1a1a; color: var(--text-light); }
        .summary-row.total { font-size: 1.3rem; font-weight: bold; color: var(--gold); border-bottom: none; margin-top: 10px; padding-top: 20px; border-top: 1px solid var(--border); }
        .empty-cart { text-align: center; padding: 60px 20px; color: var(--text-gray); }
        .empty-cart i { font-size: 4rem; margin-bottom: 20px; color: var(--gold); opacity: 0.5; }
        
        @media (max-width: 768px) {
            .cart-layout { grid-template-columns: 1fr; padding: 20px; }
            .cart-item { flex-direction: column; text-align: center; }
            .cart-item-actions { flex-direction: column; }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="header-left">
            <div class="logo">
                <a href="index.html">
                    <span class="logo-text">NIVORA</span>
                    <span class="logo-sub">SILVER</span>
                </a>
            </div>
            <nav>
                <ul>
                    <li><a href="index.html">الرئيسية</a></li>
                    <li><a href="shop.html">المتجر</a></li>
                    <li><a href="jewelry.html">الفضة والمجوهرات</a></li>
                    <li><a href="perfumes.html">العطور</a></li>
                    <li><a href="watches.html">الساعات</a></li>
                    <li><a href="sunglasses.html">النظارات الشمسية</a></li>
                </ul>
            </nav>
        </div>
        <div class="header-right">
            <i class="fa-solid fa-magnifying-glass"></i>
            <i class="fa-regular fa-user"></i>
            <a href="cart.html" style="position: relative;">
                <i class="fa-solid fa-cart-shopping"></i>
                <span class="cart-count" id="cart-count">0</span>
            </a>
            <span class="lang-switch">AR | EN</span>
        </div>
    </header>

    <!-- Cart -->
    <main>
        <div class="page-header" style="padding: 40px 5%;">
            <h1>سلة التسوق</h1>
            <div class="breadcrumb">
                <a href="index.html">الرئيسية</a> / <span>السلة</span>
            </div>
        </div>

        <div class="cart-layout">
            <div class="cart-items" id="cart-items-container">
                <!-- سيتم تحميل العناصر بواسطة JS -->
            </div>
            <div class="cart-summary" id="cart-summary">
                <h3>ملخص الطلب</h3>
                <div class="summary-row">
                    <span>المجموع الفرعي</span>
                    <span id="subtotal">0 ر.س</span>
                </div>
                <div class="summary-row">
                    <span>الشحن</span>
                    <span id="shipping">مجاني</span>
                </div>
                <div class="summary-row total">
                    <span>الإجمالي</span>
                    <span id="total">0 ر.س</span>
                </div>
                <a href="checkout.html" class="btn-gold" style="display: block; text-align: center; margin-top: 20px; padding: 15px;">
                    إتمام الطلب <i class="fa-solid fa-arrow-left"></i>
                </a>
            </div>
        </div>
    </main>

    <footer>
        <div class="footer-bottom" style="padding-top: 40px;">
            © 2025 NIVORA SILVER. جميع الحقوق محفوظة.
        </div>
    </footer>

    <script src="assets/js/products.js"></script>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/cart.js"></script>
</body>
</html>
