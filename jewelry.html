<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<script src="config/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/nivora-core.js"></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الفضة والمجوهرات | NIVORA</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <header>
        <div class="header-left">
            <div class="logo">
                <a href="index.html">
                    <span class="logo-text">NIVORA</span>
                    <span class="logo-sub">SILVER</span>
                </a>
            </div>
            <nav>
                <ul>
                    <li><a href="index.html">الرئيسية</a></li>
                    <li><a href="shop.html">المتجر</a></li>
                    <li><a href="jewelry.html" class="active">الفضة والمجوهرات</a></li>
                    <li><a href="perfumes.html">العطور</a></li>
                    <li><a href="watches.html">الساعات</a></li>
                    <li><a href="sunglasses.html">النظارات الشمسية</a></li>
                </ul>
            </nav>
        </div>
        <div class="header-right">
            <i class="fa-solid fa-magnifying-glass"></i>
            <i class="fa-regular fa-user"></i>
            <a href="cart.html" style="position: relative;">
                <i class="fa-solid fa-cart-shopping"></i>
                <span class="cart-count" id="cart-count">0</span>
            </a>
            <span class="lang-switch">AR | EN</span>
        </div>
    </header>

    <div class="page-header">
        <h1>الفضة والمجوهرات</h1>
        <div class="breadcrumb">
            <a href="index.html">الرئيسية</a> / <a href="shop.html">المتجر</a> / <span>الفضة والمجوهرات</span>
        </div>
    </div>

    <div class="shop-layout">
        <aside class="filters-sidebar">
            <div class="filter-group">
                <h4>السعر</h4>
                <input type="range" min="0" max="50000" value="50000" id="price-range">
                <p style="color: var(--text-gray); font-size: 0.85rem; margin-top: 5px;">
                    حتى <span id="price-display">50,000</span> ر.س
                </p>
            </div>
        </aside>

        <div class="shop-content">
            <div class="shop-toolbar">
                <input type="text" class="search-box" placeholder="ابحث في الفضة والمجوهرات...">
                <select id="sort-select">
                    <option value="default">الترتيب الافتراضي</option>
                    <option value="price-asc">السعر: من الأقل للأعلى</option>
                    <option value="price-desc">السعر: من الأعلى للأقل</option>
                </select>
            </div>

            <div class="products-grid" id="shop-products-grid" data-category="jewelry">
                <!-- سيتم تحميل منتجات الفضة فقط -->
            </div>
        </div>
    </div>

    <footer>
        <div class="footer-bottom" style="padding-top: 40px;">
            © 2025 NIVORA SILVER. جميع الحقوق محفوظة.
        </div>
    </footer>

    <script src="assets/js/products.js"></script>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/cart.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const grid = document.getElementById('shop-products-grid');
            const category = grid.dataset.category;
            if (category) {
                const filtered = productsData.filter(p => p.category === category);
                renderProductGrid(grid, filtered);
            }
        });
    </script>
</body>
</html>
